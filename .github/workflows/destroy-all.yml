name: Destroy Infra (dev + optional backend)

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: false
        default: ap-northeast-2
      project:
        description: Terraform variable project
        required: false
        default: oplust
      environment:
        description: Terraform variable environment
        required: false
        default: dev
      base_domain:
        description: Terraform variable base_domain
        required: true
        default: openthetaste.cloud
      state_key:
        description: Terraform state key for dev
        required: false
        default: oplust/dev/terraform.tfstate
      state_bucket:
        description: Terraform state bucket for dev (optional; auto-derived if empty)
        required: false
        default: ""
      destroy_backend:
        description: Destroy global/backend after dev destroy (true/false)
        required: true
        default: "false"
      force_cleanup:
        description: Run force cleanup by prefix/tags when state is missing (true/false)
        required: true
        default: "true"
      confirm:
        description: Type DESTROY to continue
        required: true
        default: ""

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Generate backend.hcl for dev
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          INPUT_BUCKET="${{ github.event.inputs.state_bucket }}"

          if [ -n "$INPUT_BUCKET" ]; then
            BUCKET="$INPUT_BUCKET"
          else
            BUCKET="oplust-tfstate-${ACCOUNT_ID}-${REGION}"
          fi

          cat > environments/dev/backend.hcl <<EOF
          bucket       = "${BUCKET}"
          key          = "${{ github.event.inputs.state_key || 'oplust/dev/terraform.tfstate' }}"
          region       = "${REGION}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: Terraform Init (dev)
        run: terraform -chdir=environments/dev init -backend-config=backend.hcl -reconfigure

      - name: Terraform Destroy Plan (dev)
        run: terraform -chdir=environments/dev plan -destroy -var="aws_region=${{ github.event.inputs.aws_region || 'ap-northeast-2' }}" -var="project=${{ github.event.inputs.project || 'oplust' }}" -var="environment=${{ github.event.inputs.environment || 'dev' }}" -var="base_domain=${{ github.event.inputs.base_domain || 'openthetaste.cloud' }}" -out destroy.tfplan

      - name: Terraform Destroy Apply (dev)
        run: terraform -chdir=environments/dev apply -auto-approve destroy.tfplan

  destroy-backend:
    runs-on: ubuntu-latest
    needs: destroy-dev
    if: ${{ github.event.inputs.confirm == 'DESTROY' && github.event.inputs.destroy_backend == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Terraform Init (global/backend)
        run: terraform -chdir=global/backend init

      - name: Import existing backend bucket resources if present
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          BUCKET_INPUT="${{ github.event.inputs.state_bucket }}"
          if [ -n "$BUCKET_INPUT" ]; then
            BUCKET="$BUCKET_INPUT"
          else
            BUCKET="oplust-tfstate-${ACCOUNT_ID}-${REGION}"
          fi

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Existing bucket detected: $BUCKET"
            terraform -chdir=global/backend import aws_s3_bucket.state "$BUCKET" || true
            terraform -chdir=global/backend import aws_s3_bucket_versioning.state "$BUCKET" || true
            terraform -chdir=global/backend import aws_s3_bucket_server_side_encryption_configuration.state "$BUCKET" || true
            terraform -chdir=global/backend import aws_s3_bucket_public_access_block.state "$BUCKET" || true
            terraform -chdir=global/backend import aws_s3_bucket_ownership_controls.state "$BUCKET" || true
          else
            echo "No backend bucket found to import."
          fi

      - name: Terraform Destroy Plan (global/backend)
        run: terraform -chdir=global/backend plan -destroy -var="force_destroy_bucket=true" -out destroy.tfplan

      - name: Terraform Destroy Apply (global/backend)
        run: terraform -chdir=global/backend apply -auto-approve destroy.tfplan

  force-cleanup:
    runs-on: ubuntu-latest
    needs: destroy-dev
    if: ${{ github.event.inputs.confirm == 'DESTROY' && needs.destroy-dev.result == 'success' && github.event.inputs.force_cleanup == 'true' }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Force cleanup by prefix/tags
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ github.event.inputs.project || 'oplust' }}"
          ENV_NAME="${{ github.event.inputs.environment || 'dev' }}"
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          PREFIX="${PROJECT}-${ENV_NAME}"
          MEDIA_BUCKET_PREFIX="${PROJECT}-${ENV_NAME}-media"

          echo "[force-cleanup] REGION=$REGION PREFIX=$PREFIX"

          # ECS services -> scale 0 and delete
          clusters=$(aws ecs list-clusters --region "$REGION" --query 'clusterArns[]' --output text || true)
          for c in $clusters; do
            services=$(aws ecs list-services --cluster "$c" --region "$REGION" --query 'serviceArns[]' --output text || true)
            for s in $services; do
              if [[ "$s" == *"$PREFIX"* ]]; then
                aws ecs update-service --region "$REGION" --cluster "$c" --service "$s" --desired-count 0 >/dev/null 2>&1 || true
                aws ecs delete-service --region "$REGION" --cluster "$c" --service "$s" --force >/dev/null 2>&1 || true
              fi
            done
          done

          # ALB and target groups
          lbs=$(aws elbv2 describe-load-balancers --region "$REGION" --query "LoadBalancers[?contains(LoadBalancerName, '$PREFIX')].LoadBalancerArn" --output text || true)
          for lb in $lbs; do
            aws elbv2 delete-load-balancer --region "$REGION" --load-balancer-arn "$lb" >/dev/null 2>&1 || true
          done
          tgs=$(aws elbv2 describe-target-groups --region "$REGION" --query "TargetGroups[?contains(TargetGroupName, '$PREFIX')].TargetGroupArn" --output text || true)
          for tg in $tgs; do
            aws elbv2 delete-target-group --region "$REGION" --target-group-arn "$tg" >/dev/null 2>&1 || true
          done

          # EC2 instances by tags
          instance_ids=$(aws ec2 describe-instances --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' --output text || true)
          if [ -n "$instance_ids" ]; then
            aws ec2 terminate-instances --region "$REGION" --instance-ids $instance_ids >/dev/null 2>&1 || true
          fi

          # RDS
          dbs=$(aws rds describe-db-instances --region "$REGION" --query "DBInstances[?contains(DBInstanceIdentifier, '$PREFIX')].DBInstanceIdentifier" --output text || true)
          for db in $dbs; do
            aws rds delete-db-instance --region "$REGION" --db-instance-identifier "$db" --skip-final-snapshot --delete-automated-backups >/dev/null 2>&1 || true
          done
          subnets=$(aws rds describe-db-subnet-groups --region "$REGION" --query "DBSubnetGroups[?contains(DBSubnetGroupName, '$PREFIX')].DBSubnetGroupName" --output text || true)
          for s in $subnets; do
            aws rds delete-db-subnet-group --region "$REGION" --db-subnet-group-name "$s" >/dev/null 2>&1 || true
          done

          # NAT Gateway
          nat_ids=$(aws ec2 describe-nat-gateways --region "$REGION" \
            --filter Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=state,Values=available,pending \
            --query 'NatGateways[].NatGatewayId' --output text || true)
          for n in $nat_ids; do
            aws ec2 delete-nat-gateway --region "$REGION" --nat-gateway-id "$n" >/dev/null 2>&1 || true
          done

          # Release EIP (disassociated only)
          allocs=$(aws ec2 describe-addresses --region "$REGION" \
            --query "Addresses[?AssociationId==null && Tags[?Key=='Project' && Value=='$PROJECT'] && Tags[?Key=='Env' && Value=='$ENV_NAME']].AllocationId" --output text || true)
          for a in $allocs; do
            aws ec2 release-address --region "$REGION" --allocation-id "$a" >/dev/null 2>&1 || true
          done

          # IAM roles by prefix
          roles=$(aws iam list-roles --query "Roles[?contains(RoleName, '$PREFIX')].RoleName" --output text || true)
          for r in $roles; do
            profiles=$(aws iam list-instance-profiles-for-role --role-name "$r" --query 'InstanceProfiles[].InstanceProfileName' --output text || true)
            for p in $profiles; do
              aws iam remove-role-from-instance-profile --instance-profile-name "$p" --role-name "$r" >/dev/null 2>&1 || true
              aws iam delete-instance-profile --instance-profile-name "$p" >/dev/null 2>&1 || true
            done
            inline=$(aws iam list-role-policies --role-name "$r" --query 'PolicyNames[]' --output text || true)
            for ip in $inline; do
              aws iam delete-role-policy --role-name "$r" --policy-name "$ip" >/dev/null 2>&1 || true
            done
            attached=$(aws iam list-attached-role-policies --role-name "$r" --query 'AttachedPolicies[].PolicyArn' --output text || true)
            for ap in $attached; do
              aws iam detach-role-policy --role-name "$r" --policy-arn "$ap" >/dev/null 2>&1 || true
            done
            aws iam delete-role --role-name "$r" >/dev/null 2>&1 || true
          done

          # Secrets
          secrets=$(aws secretsmanager list-secrets --region "$REGION" --query "SecretList[?contains(Name, '$PROJECT/$ENV_NAME/')].Name" --output text || true)
          for s in $secrets; do
            aws secretsmanager delete-secret --region "$REGION" --secret-id "$s" --force-delete-without-recovery >/dev/null 2>&1 || true
          done

          # S3 media bucket(s)
          buckets=$(aws s3api list-buckets --query "Buckets[?contains(Name, '$MEDIA_BUCKET_PREFIX')].Name" --output text || true)
          for b in $buckets; do
            aws s3 rb "s3://$b" --force >/dev/null 2>&1 || true
          done

          echo "[force-cleanup] completed."

  verify-no-leftovers:
    runs-on: ubuntu-latest
    needs:
      - destroy-dev
      - destroy-backend
      - force-cleanup
    if: ${{ always() && github.event.inputs.confirm == 'DESTROY' && (needs.destroy-dev.result == 'success') && (github.event.inputs.destroy_backend != 'true' || needs.destroy-backend.result == 'success') }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Verify leftover resources
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="oplust"
          ENV_NAME="dev"
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          failures=0

          check_count() {
            local name="$1"
            local count="$2"
            echo "${name}: ${count}"
            if [ "$count" -gt 0 ]; then
              failures=$((failures+1))
            fi
          }

          nat_count=$(aws ec2 describe-nat-gateways \
            --region "$REGION" \
            --filter Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=state,Values=available,pending \
            --query 'length(NatGateways)' --output text)
          check_count "NAT Gateways" "$nat_count"

          eip_count=$(aws ec2 describe-addresses \
            --region "$REGION" \
            --query "length(Addresses[?Tags[?Key=='Project' && Value=='$PROJECT'] && Tags[?Key=='Env' && Value=='$ENV_NAME']])" --output text)
          check_count "Elastic IPs" "$eip_count"

          lb_count=$(aws elbv2 describe-load-balancers --region "$REGION" \
            --query "length(LoadBalancers[?contains(LoadBalancerName, '$PROJECT-$ENV_NAME')])" --output text)
          check_count "Load Balancers" "$lb_count"

          rds_count=$(aws rds describe-db-instances --region "$REGION" \
            --query "length(DBInstances[?contains(DBInstanceIdentifier, '$PROJECT-$ENV_NAME')])" --output text)
          check_count "RDS Instances" "$rds_count"

          ec2_count=$(aws ec2 describe-instances --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down \
            --query 'length(Reservations[].Instances[])' --output text)
          check_count "EC2 Instances" "$ec2_count"

          cluster_arns=$(aws ecs list-clusters --region "$REGION" --query 'clusterArns[]' --output text || true)
          ecs_active=0
          if [ -n "$cluster_arns" ]; then
            for c in $cluster_arns; do
              services=$(aws ecs list-services --cluster "$c" --region "$REGION" --query 'serviceArns[]' --output text || true)
              for s in $services; do
                if [[ "$s" == *"$PROJECT-$ENV_NAME"* ]]; then
                  ecs_active=$((ecs_active+1))
                fi
              done
            done
          fi
          check_count "ECS Services" "$ecs_active"

          set +e
          cf_count=$(aws cloudfront list-distributions \
            --query "length(DistributionList.Items[?Comment=='$PROJECT-$ENV_NAME'])" --output text 2>/dev/null)
          cf_status=$?
          set -e
          if [ $cf_status -ne 0 ] || [ -z "$cf_count" ] || [ "$cf_count" = "None" ] || [ "$cf_count" = "null" ]; then
            cf_count=0
          fi
          check_count "CloudFront Distributions" "$cf_count"

          s3_count=$(aws s3api list-buckets \
            --query "length(Buckets[?contains(Name, '$PROJECT-$ENV_NAME-media')])" --output text)
          check_count "S3 Media Buckets" "$s3_count"

          echo "----------------------------------------"
          if [ "$failures" -gt 0 ]; then
            echo "[FAIL] leftover billable resources detected: ${failures} category(ies)."
            exit 1
          else
            echo "[PASS] no leftover resources detected for ${PROJECT}/${ENV_NAME}."
          fi

  guard:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm != 'DESTROY' }}
    steps:
      - name: Guard message
        run: |
          echo "Skipped: confirm input is not DESTROY."
          exit 1
