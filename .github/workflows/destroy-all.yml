name: Destroy Infra (dev + optional backend)

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: false
        default: ap-northeast-2
      project:
        description: Terraform variable project
        required: false
        default: oplust
      environment:
        description: Terraform variable environment
        required: false
        default: dev
      base_domain:
        description: Terraform variable base_domain
        required: true
        default: openthetaste.cloud
      state_key:
        description: Terraform state key for dev
        required: false
        default: oplust/dev/terraform.tfstate
      state_bucket:
        description: Terraform state bucket for dev (optional; auto-derived if empty)
        required: false
        default: ""
      destroy_backend:
        description: Destroy global/backend after dev destroy (true/false)
        required: true
        default: "false"
      force_cleanup:
        description: Run force cleanup by prefix/tags when state is missing (true/false)
        required: true
        default: "true"
      confirm:
        description: Type DESTROY to continue
        required: true
        default: ""

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Generate backend.hcl for dev
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          INPUT_BUCKET="${{ github.event.inputs.state_bucket }}"

          if [ -n "$INPUT_BUCKET" ]; then
            BUCKET="$INPUT_BUCKET"
          else
            BUCKET="oplust-tfstate-${ACCOUNT_ID}-${REGION}"
          fi

          cat > environments/dev/backend.hcl <<EOF
          bucket       = "${BUCKET}"
          key          = "${{ github.event.inputs.state_key || 'oplust/dev/terraform.tfstate' }}"
          region       = "${REGION}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: Terraform Init (dev)
        run: terraform -chdir=environments/dev init -backend-config=backend.hcl -reconfigure

      - name: Terraform Destroy Plan (dev)
        run: terraform -chdir=environments/dev plan -destroy -var="aws_region=${{ github.event.inputs.aws_region || 'ap-northeast-2' }}" -var="project=${{ github.event.inputs.project || 'oplust' }}" -var="environment=${{ github.event.inputs.environment || 'dev' }}" -var="base_domain=${{ github.event.inputs.base_domain || 'openthetaste.cloud' }}" -out destroy.tfplan

      - name: Terraform Destroy Apply (dev)
        shell: bash
        run: |
          set +e
          terraform -chdir=environments/dev apply -auto-approve destroy.tfplan
          ec=$?
          set -e
          if [ "$ec" -ne 0 ]; then
            echo "[warn] terraform destroy apply failed in destroy-dev (exit=$ec)."
            echo "[warn] continue to force-cleanup for residual resources."
          fi

  destroy-backend:
    runs-on: ubuntu-latest
    needs: destroy-dev
    if: ${{ always() && github.event.inputs.confirm == 'DESTROY' && github.event.inputs.destroy_backend == 'true' && needs.destroy-dev.result != 'cancelled' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Terraform Init (global/backend)
        run: terraform -chdir=global/backend init

      - name: Import existing backend bucket resources if present
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          BUCKET_INPUT="${{ github.event.inputs.state_bucket }}"
          if [ -n "$BUCKET_INPUT" ]; then
            BUCKET="$BUCKET_INPUT"
          else
            BUCKET="oplust-tfstate-${ACCOUNT_ID}-${REGION}"
          fi

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Existing bucket detected: $BUCKET"
            terraform -chdir=global/backend import aws_s3_bucket.state "$BUCKET" || true
            # Optional nested resources may not exist; bucket import is sufficient.
          else
            echo "No backend bucket found to import."
          fi

      - name: Empty backend bucket versions before destroy
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          BUCKET_INPUT="${{ github.event.inputs.state_bucket }}"
          if [ -n "$BUCKET_INPUT" ]; then
            BUCKET="$BUCKET_INPUT"
          else
            BUCKET="oplust-tfstate-${ACCOUNT_ID}-${REGION}"
          fi

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Backend bucket does not exist. Skip emptying."
            exit 0
          fi

          # Delete current objects
          aws s3 rm "s3://$BUCKET" --recursive || true

          # Delete all versions/delete-markers with pagination until empty
          while true; do
            page=$(aws s3api list-object-versions --bucket "$BUCKET" --max-items 1000 --output json)
            payload=$(echo "$page" | jq '{Objects: ((.Versions // []) + (.DeleteMarkers // []) | map({Key:.Key,VersionId:.VersionId})), Quiet:true}')
            count=$(echo "$payload" | jq '.Objects | length')
            if [ "$count" -eq 0 ]; then
              break
            fi
            aws s3api delete-objects --bucket "$BUCKET" --delete "$payload" || true
          done

          # Abort any in-progress multipart uploads
          uploads=$(aws s3api list-multipart-uploads --bucket "$BUCKET" --query 'Uploads[].{Key:Key,UploadId:UploadId}' --output json 2>/dev/null || echo "[]")
          echo "$uploads" | jq -c '.[]?' | while read -r u; do
            key=$(echo "$u" | jq -r '.Key')
            upload_id=$(echo "$u" | jq -r '.UploadId')
            aws s3api abort-multipart-upload --bucket "$BUCKET" --key "$key" --upload-id "$upload_id" || true
          done

          echo "Backend bucket objects/versions cleanup done."

      - name: Terraform Destroy Plan (global/backend)
        run: terraform -chdir=global/backend plan -destroy -var="force_destroy_bucket=true" -out destroy.tfplan

      - name: Terraform Destroy Apply (global/backend)
        run: terraform -chdir=global/backend apply -auto-approve destroy.tfplan

  force-cleanup:
    runs-on: ubuntu-latest
    needs: destroy-dev
    if: ${{ always() && github.event.inputs.confirm == 'DESTROY' && github.event.inputs.force_cleanup == 'true' && needs.destroy-dev.result != 'cancelled' }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Force cleanup by prefix/tags
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ github.event.inputs.project || 'oplust' }}"
          ENV_NAME="${{ github.event.inputs.environment || 'dev' }}"
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          PREFIX="${PROJECT}-${ENV_NAME}"
          MEDIA_BUCKET_PREFIX="${PROJECT}-${ENV_NAME}-media"

          echo "[force-cleanup] REGION=$REGION PREFIX=$PREFIX"

          # ECS services -> scale 0 and delete
          clusters=$(aws ecs list-clusters --region "$REGION" --query 'clusterArns[]' --output text || true)
          for c in $clusters; do
            services=$(aws ecs list-services --cluster "$c" --region "$REGION" --query 'serviceArns[]' --output text || true)
            for s in $services; do
              if [[ "$s" == *"$PREFIX"* ]]; then
                aws ecs update-service --region "$REGION" --cluster "$c" --service "$s" --desired-count 0 >/dev/null 2>&1 || true
                aws ecs delete-service --region "$REGION" --cluster "$c" --service "$s" --force >/dev/null 2>&1 || true
              fi
            done
          done

          # ALB and target groups
          lbs=$(aws elbv2 describe-load-balancers --region "$REGION" --query "LoadBalancers[?contains(LoadBalancerName, '$PREFIX')].LoadBalancerArn" --output text || true)
          for lb in $lbs; do
            aws elbv2 delete-load-balancer --region "$REGION" --load-balancer-arn "$lb" >/dev/null 2>&1 || true
          done
          tgs=$(aws elbv2 describe-target-groups --region "$REGION" --query "TargetGroups[?contains(TargetGroupName, '$PREFIX')].TargetGroupArn" --output text || true)
          for tg in $tgs; do
            aws elbv2 delete-target-group --region "$REGION" --target-group-arn "$tg" >/dev/null 2>&1 || true
          done

          # EC2 instances by tags
          instance_ids=$(aws ec2 describe-instances --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[].Instances[].InstanceId' --output text || true)
          if [ -n "$instance_ids" ]; then
            aws ec2 terminate-instances --region "$REGION" --instance-ids $instance_ids >/dev/null 2>&1 || true
          fi

          # RDS
          dbs=$(aws rds describe-db-instances --region "$REGION" --query "DBInstances[?contains(DBInstanceIdentifier, '$PREFIX')].DBInstanceIdentifier" --output text || true)
          for db in $dbs; do
            aws rds modify-db-instance --region "$REGION" --db-instance-identifier "$db" --no-deletion-protection --apply-immediately >/dev/null 2>&1 || true
            aws rds delete-db-instance --region "$REGION" --db-instance-identifier "$db" --skip-final-snapshot --delete-automated-backups >/dev/null 2>&1 || true
          done
          subnets=$(aws rds describe-db-subnet-groups --region "$REGION" --query "DBSubnetGroups[?contains(DBSubnetGroupName, '$PREFIX')].DBSubnetGroupName" --output text || true)
          for s in $subnets; do
            aws rds delete-db-subnet-group --region "$REGION" --db-subnet-group-name "$s" >/dev/null 2>&1 || true
          done

          # NAT Gateway
          nat_ids=$(aws ec2 describe-nat-gateways --region "$REGION" \
            --filter Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=state,Values=available,pending \
            --query 'NatGateways[].NatGatewayId' --output text || true)
          for n in $nat_ids; do
            aws ec2 delete-nat-gateway --region "$REGION" --nat-gateway-id "$n" >/dev/null 2>&1 || true
          done

          # Release EIP (disassociate first if still attached)
          eip_pairs=$(aws ec2 describe-addresses --region "$REGION" \
            --query "Addresses[?Tags[?Key=='Project' && Value=='$PROJECT'] && Tags[?Key=='Env' && Value=='$ENV_NAME']].[AllocationId,AssociationId]" \
            --output text || true)
          if [ -n "$eip_pairs" ]; then
            while read -r alloc assoc; do
              [ -z "${alloc:-}" ] && continue
              if [ -n "${assoc:-}" ] && [ "$assoc" != "None" ] && [ "$assoc" != "null" ]; then
                aws ec2 disassociate-address --region "$REGION" --association-id "$assoc" >/dev/null 2>&1 || true
              fi
              aws ec2 release-address --region "$REGION" --allocation-id "$alloc" >/dev/null 2>&1 || true
            done <<< "$eip_pairs"
          fi

          # IAM roles by prefix
          roles=$(aws iam list-roles --query "Roles[?contains(RoleName, '$PREFIX')].RoleName" --output text || true)
          for r in $roles; do
            profiles=$(aws iam list-instance-profiles-for-role --role-name "$r" --query 'InstanceProfiles[].InstanceProfileName' --output text || true)
            for p in $profiles; do
              aws iam remove-role-from-instance-profile --instance-profile-name "$p" --role-name "$r" >/dev/null 2>&1 || true
              aws iam delete-instance-profile --instance-profile-name "$p" >/dev/null 2>&1 || true
            done
            inline=$(aws iam list-role-policies --role-name "$r" --query 'PolicyNames[]' --output text || true)
            for ip in $inline; do
              aws iam delete-role-policy --role-name "$r" --policy-name "$ip" >/dev/null 2>&1 || true
            done
            attached=$(aws iam list-attached-role-policies --role-name "$r" --query 'AttachedPolicies[].PolicyArn' --output text || true)
            for ap in $attached; do
              aws iam detach-role-policy --role-name "$r" --policy-arn "$ap" >/dev/null 2>&1 || true
            done
            aws iam delete-role --role-name "$r" >/dev/null 2>&1 || true
          done

          # Secrets
          secrets=$(aws secretsmanager list-secrets --region "$REGION" --query "SecretList[?contains(Name, '$PROJECT/$ENV_NAME/')].Name" --output text || true)
          for s in $secrets; do
            aws secretsmanager delete-secret --region "$REGION" --secret-id "$s" --force-delete-without-recovery >/dev/null 2>&1 || true
          done

          # S3 media bucket(s)
          buckets=$(aws s3api list-buckets --query "Buckets[?contains(Name, '$MEDIA_BUCKET_PREFIX')].Name" --output text || true)
          for b in $buckets; do
            aws s3 rb "s3://$b" --force >/dev/null 2>&1 || true
          done

          # CloudFront distributions by comment prefix: disable then delete
          dist_ids=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${PREFIX}'].Id" --output text 2>/dev/null || true)
          for did in $dist_ids; do
            [ -z "${did:-}" ] && continue
            cfg_file=$(mktemp)
            etag=$(aws cloudfront get-distribution-config --id "$did" --query 'ETag' --output text 2>/dev/null || true)
            aws cloudfront get-distribution-config --id "$did" --query 'DistributionConfig' --output json > "$cfg_file" 2>/dev/null || true
            if [ -s "$cfg_file" ] && [ -n "${etag:-}" ] && [ "$etag" != "None" ] && [ "$etag" != "null" ]; then
              jq '.Enabled=false' "$cfg_file" > "${cfg_file}.disabled" && mv "${cfg_file}.disabled" "$cfg_file"
              aws cloudfront update-distribution --id "$did" --if-match "$etag" --distribution-config file://"$cfg_file" >/dev/null 2>&1 || true
              # Wait until deployed before delete
              for _ in {1..40}; do
                status=$(aws cloudfront get-distribution --id "$did" --query 'Distribution.Status' --output text 2>/dev/null || echo "Unknown")
                [ "$status" = "Deployed" ] && break
                sleep 15
              done
              del_etag=$(aws cloudfront get-distribution-config --id "$did" --query 'ETag' --output text 2>/dev/null || true)
              aws cloudfront delete-distribution --id "$did" --if-match "$del_etag" >/dev/null 2>&1 || true
            fi
            rm -f "$cfg_file" "${cfg_file}.disabled" >/dev/null 2>&1 || true
          done

          # CloudFront Origin Access Controls by name prefix
          oac_ids=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?contains(Name, '${PREFIX}')].Id" --output text 2>/dev/null || true)
          for oid in $oac_ids; do
            [ -z "${oid:-}" ] && continue

            # Find distributions using this OAC and delete them first.
            using_dist_ids=$(aws cloudfront list-distributions --output json 2>/dev/null | jq -r --arg OID "$oid" '
              (.DistributionList.Items // [])
              | map(select(any(.Origins.Items[]?; .OriginAccessControlId? == $OID)))
              | .[].Id
            ' || true)

            for did in $using_dist_ids; do
              [ -z "${did:-}" ] && continue
              cfg_file=$(mktemp)
              etag=$(aws cloudfront get-distribution-config --id "$did" --query 'ETag' --output text 2>/dev/null || true)
              aws cloudfront get-distribution-config --id "$did" --query 'DistributionConfig' --output json > "$cfg_file" 2>/dev/null || true
              if [ -s "$cfg_file" ] && [ -n "${etag:-}" ] && [ "$etag" != "None" ] && [ "$etag" != "null" ]; then
                jq '.Enabled=false' "$cfg_file" > "${cfg_file}.disabled" && mv "${cfg_file}.disabled" "$cfg_file"
                aws cloudfront update-distribution --id "$did" --if-match "$etag" --distribution-config file://"$cfg_file" >/dev/null 2>&1 || true
                for _ in {1..40}; do
                  status=$(aws cloudfront get-distribution --id "$did" --query 'Distribution.Status' --output text 2>/dev/null || echo "Unknown")
                  [ "$status" = "Deployed" ] && break
                  sleep 15
                done
                del_etag=$(aws cloudfront get-distribution-config --id "$did" --query 'ETag' --output text 2>/dev/null || true)
                aws cloudfront delete-distribution --id "$did" --if-match "$del_etag" >/dev/null 2>&1 || true
              fi
              rm -f "$cfg_file" "${cfg_file}.disabled" >/dev/null 2>&1 || true
            done

            # Retry OAC delete after dependent distributions cleanup.
            for _ in {1..10}; do
              oac_etag=$(aws cloudfront get-origin-access-control --id "$oid" --query 'ETag' --output text 2>/dev/null || true)
              if [ -z "${oac_etag:-}" ] || [ "$oac_etag" = "None" ] || [ "$oac_etag" = "null" ]; then
                break
              fi
              if aws cloudfront delete-origin-access-control --id "$oid" --if-match "$oac_etag" >/dev/null 2>&1; then
                break
              fi
              sleep 15
            done
          done

          # ACM certificates for base/admin/media domains
          base_domain="${{ github.event.inputs.base_domain || 'openthetaste.cloud' }}"
          admin_domain="admin.${base_domain}"
          media_domain="cdn.${base_domain}"
          cert_arns=$(aws acm list-certificates --region "$REGION" \
            --query "CertificateSummaryList[?DomainName=='${base_domain}' || DomainName=='${admin_domain}' || DomainName=='${media_domain}'].CertificateArn" \
            --output text 2>/dev/null || true)
          for c in $cert_arns; do
            aws acm delete-certificate --region "$REGION" --certificate-arn "$c" >/dev/null 2>&1 || true
          done

          # CloudWatch log groups
          ecs_lg_names=$(aws logs describe-log-groups --region "$REGION" \
            --log-group-name-prefix "/ecs/${PROJECT}-${ENV_NAME}" \
            --query 'logGroups[].logGroupName' --output text || true)
          for lg in $ecs_lg_names; do
            aws logs delete-log-group --region "$REGION" --log-group-name "$lg" >/dev/null 2>&1 || true
          done

          lambda_lg_names=$(aws logs describe-log-groups --region "$REGION" \
            --log-group-name-prefix "/aws/lambda/${PROJECT}-${ENV_NAME}" \
            --query 'logGroups[].logGroupName' --output text || true)
          for lg in $lambda_lg_names; do
            aws logs delete-log-group --region "$REGION" --log-group-name "$lg" >/dev/null 2>&1 || true
          done

          echo "[force-cleanup] completed."

  verify-no-leftovers:
    runs-on: ubuntu-latest
    needs:
      - destroy-dev
      - destroy-backend
      - force-cleanup
    if: ${{ always() && github.event.inputs.confirm == 'DESTROY' && needs.force-cleanup.result == 'success' && (github.event.inputs.destroy_backend != 'true' || needs.destroy-backend.result == 'success') }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Verify leftover resources
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="oplust"
          ENV_NAME="dev"
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          failures=0

          check_count() {
            local name="$1"
            local count="$2"
            echo "${name}: ${count}"
            if [ "$count" -gt 0 ]; then
              failures=$((failures+1))
            fi
          }

          nat_count=$(aws ec2 describe-nat-gateways \
            --region "$REGION" \
            --filter Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=state,Values=available,pending \
            --query 'length(NatGateways)' --output text)
          check_count "NAT Gateways" "$nat_count"

          eip_count=$(aws ec2 describe-addresses \
            --region "$REGION" \
            --query "length(Addresses[?Tags[?Key=='Project' && Value=='$PROJECT'] && Tags[?Key=='Env' && Value=='$ENV_NAME']])" --output text)
          check_count "Elastic IPs" "$eip_count"

          lb_count=$(aws elbv2 describe-load-balancers --region "$REGION" \
            --query "length(LoadBalancers[?contains(LoadBalancerName, '$PROJECT-$ENV_NAME')])" --output text)
          check_count "Load Balancers" "$lb_count"

          rds_count=$(aws rds describe-db-instances --region "$REGION" \
            --query "length(DBInstances[?contains(DBInstanceIdentifier, '$PROJECT-$ENV_NAME')])" --output text)
          check_count "RDS Instances" "$rds_count"

          ec2_count=$(aws ec2 describe-instances --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down \
            --query 'length(Reservations[].Instances[])' --output text)
          check_count "EC2 Instances" "$ec2_count"

          cluster_arns=$(aws ecs list-clusters --region "$REGION" --query 'clusterArns[]' --output text || true)
          ecs_active=0
          if [ -n "$cluster_arns" ]; then
            for c in $cluster_arns; do
              services=$(aws ecs list-services --cluster "$c" --region "$REGION" --query 'serviceArns[]' --output text || true)
              for s in $services; do
                if [[ "$s" == *"$PROJECT-$ENV_NAME"* ]]; then
                  ecs_active=$((ecs_active+1))
                fi
              done
            done
          fi
          check_count "ECS Services" "$ecs_active"

          set +e
          cf_count=$(aws cloudfront list-distributions \
            --query "length(DistributionList.Items[?Comment=='$PROJECT-$ENV_NAME'])" --output text 2>/dev/null)
          cf_status=$?
          set -e
          if [ $cf_status -ne 0 ] || [ -z "$cf_count" ] || [ "$cf_count" = "None" ] || [ "$cf_count" = "null" ]; then
            cf_count=0
          fi
          check_count "CloudFront Distributions" "$cf_count"

          set +e
          oac_count=$(aws cloudfront list-origin-access-controls \
            --query "length(OriginAccessControlList.Items[?contains(Name, '$PROJECT-$ENV_NAME')])" --output text 2>/dev/null)
          oac_status=$?
          set -e
          if [ $oac_status -ne 0 ] || [ -z "$oac_count" ] || [ "$oac_count" = "None" ] || [ "$oac_count" = "null" ]; then
            oac_count=0
          fi
          check_count "CloudFront OAC" "$oac_count"

          acm_count=$(aws acm list-certificates --region "$REGION" \
            --query "length(CertificateSummaryList[?contains(DomainName, '$PROJECT') || contains(DomainName, '${{ github.event.inputs.base_domain || 'openthetaste.cloud' }}')])" \
            --output text 2>/dev/null || echo 0)
          check_count "ACM Certificates" "$acm_count"

          s3_count=$(aws s3api list-buckets \
            --query "length(Buckets[?contains(Name, '$PROJECT-$ENV_NAME-media')])" --output text)
          check_count "S3 Media Buckets" "$s3_count"

          # EBS volumes (unattached cost risk)
          ebs_count=$(aws ec2 describe-volumes --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" \
            --query 'length(Volumes[])' --output text)
          check_count "EBS Volumes" "$ebs_count"

          # EBS snapshots (storage cost risk)
          snap_count=$(aws ec2 describe-snapshots --region "$REGION" --owner-ids self \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" \
            --query 'length(Snapshots[])' --output text)
          check_count "EBS Snapshots" "$snap_count"

          # ENI (detached ENI can block subnet/vpc delete and sometimes cost indirectly)
          eni_count=$(aws ec2 describe-network-interfaces --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" \
            --query 'length(NetworkInterfaces[])' --output text)
          check_count "Network Interfaces" "$eni_count"

          # Lambda functions
          lambda_count=$(aws lambda list-functions --region "$REGION" \
            --query "length(Functions[?contains(FunctionName, '$PROJECT-$ENV_NAME')])" --output text)
          check_count "Lambda Functions" "$lambda_count"

          # Lambda log groups
          lambda_log_count=$(aws logs describe-log-groups --region "$REGION" \
            --log-group-name-prefix "/aws/lambda/${PROJECT}-${ENV_NAME}" \
            --query 'length(logGroups)' --output text)
          check_count "Lambda Log Groups" "$lambda_log_count"

          # ECS/Container log groups
          ecs_log_count=$(aws logs describe-log-groups --region "$REGION" \
            --log-group-name-prefix "/ecs/${PROJECT}-${ENV_NAME}" \
            --query 'length(logGroups)' --output text)
          check_count "ECS Log Groups" "$ecs_log_count"

          # Security groups
          sg_count=$(aws ec2 describe-security-groups --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" \
            --query 'length(SecurityGroups[])' --output text)
          check_count "Security Groups" "$sg_count"

          # VPCs
          vpc_count=$(aws ec2 describe-vpcs --region "$REGION" \
            --filters Name=tag:Project,Values="$PROJECT" Name=tag:Env,Values="$ENV_NAME" \
            --query 'length(Vpcs[])' --output text)
          check_count "VPCs" "$vpc_count"

          # Secrets Manager
          secrets_count=$(aws secretsmanager list-secrets --region "$REGION" \
            --query "length(SecretList[?contains(Name, '$PROJECT/$ENV_NAME/')])" --output text)
          check_count "Secrets" "$secrets_count"

          # SSM Parameters
          ssm_count=$(aws ssm describe-parameters --region "$REGION" \
            --parameter-filters "Key=Name,Option=BeginsWith,Values=/$PROJECT/$ENV_NAME/" \
            --query 'length(Parameters[])' --output text)
          check_count "SSM Parameters" "$ssm_count"

          # ECR repositories
          ecr_count=$(aws ecr describe-repositories --region "$REGION" \
            --query "length(repositories[?contains(repositoryName, '$PROJECT-$ENV_NAME')])" --output text 2>/dev/null || echo 0)
          check_count "ECR Repositories" "$ecr_count"

          echo "----------------------------------------"
          if [ "$failures" -gt 0 ]; then
            echo "[FAIL] leftover billable resources detected: ${failures} category(ies)."
            exit 1
          else
            echo "[PASS] no leftover resources detected for ${PROJECT}/${ENV_NAME}."
          fi

  guard:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm != 'DESTROY' }}
    steps:
      - name: Guard message
        run: |
          echo "Skipped: confirm input is not DESTROY."
          exit 1
