name: Deploy Dev (environments/dev)

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: false
        default: ap-northeast-2
      project:
        description: Terraform variable project
        required: false
        default: oplust
      environment:
        description: Terraform variable environment
        required: false
        default: dev
      base_domain:
        description: Terraform variable base_domain
        required: true
        default: openthetaste.cloud
      state_key:
        description: Terraform state key for dev
        required: false
        default: oplust/dev/terraform.tfstate
      state_bucket:
        description: Terraform state bucket for dev (optional; auto-derived if empty)
        required: false
        default: ""

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Restore scheduled-deletion secrets (best effort)
        shell: bash
        run: |
          set -euo pipefail

          secrets=(
            "oplust/dev/rabbitmq/admin-credentials"
            "oplust/dev/rabbitmq/credentials"
            "oplust/dev/monitoring/grafana-admin-credentials"
          )

          for s in "${secrets[@]}"; do
            echo "Try restore secret: $s"
            aws secretsmanager restore-secret --secret-id "$s" >/dev/null 2>&1 || true
          done

      - name: Generate backend.hcl for dev
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          INPUT_BUCKET="${{ github.event.inputs.state_bucket }}"

          if [ -n "$INPUT_BUCKET" ]; then
            BUCKET="$INPUT_BUCKET"
          else
            BUCKET="oplust-tfstate-${ACCOUNT_ID}-${REGION}"
          fi

          cat > environments/dev/backend.hcl <<EOF
          bucket       = "${BUCKET}"
          key          = "${{ github.event.inputs.state_key || 'oplust/dev/terraform.tfstate' }}"
          region       = "${REGION}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: Terraform Init (dev)
        run: terraform -chdir=environments/dev init -backend-config=backend.hcl -reconfigure

      - name: Import existing conflict-prone resources (best effort)
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ github.event.inputs.project || 'oplust' }}"
          ENV_NAME="${{ github.event.inputs.environment || 'dev' }}"
          BASE_DOMAIN="${{ github.event.inputs.base_domain || 'openthetaste.cloud' }}"
          AWS_REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          NAME_PREFIX="${PROJECT}-${ENV_NAME}"
          OAC_NAME="${NAME_PREFIX}-media-oac"
          ECS_LOG_GROUP="/ecs/${NAME_PREFIX}-transcoder-task"
          TF_VAR_ARGS="-var=project=${PROJECT} -var=environment=${ENV_NAME} -var=base_domain=${BASE_DOMAIN} -var=aws_region=${AWS_REGION}"

          # CloudFront OAC import by name (global service)
          oac_id=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${OAC_NAME}'].Id | [0]" \
            --output text 2>/dev/null || true)
          if [ -n "${oac_id:-}" ] && [ "$oac_id" != "None" ] && [ "$oac_id" != "null" ]; then
            echo "Found existing OAC: ${OAC_NAME} (${oac_id})"
            if terraform -chdir=environments/dev state show 'module.orchestrator.module.cloudfront[0].aws_cloudfront_origin_access_control.this[0]' >/dev/null 2>&1; then
              echo "OAC resource already in terraform state. Skip import."
            else
            set +e
            terraform -chdir=environments/dev import \
              $TF_VAR_ARGS \
              'module.orchestrator.module.cloudfront[0].aws_cloudfront_origin_access_control.this[0]' \
              "$oac_id"
            import_ec=$?
            set -e
            if [ "$import_ec" -ne 0 ]; then
              echo "OAC import failed. Trying delete as fallback..."
              etag=$(aws cloudfront get-origin-access-control --id "$oac_id" --query 'ETag' --output text 2>/dev/null || true)
              if [ -n "${etag:-}" ] && [ "$etag" != "None" ] && [ "$etag" != "null" ]; then
                aws cloudfront delete-origin-access-control --id "$oac_id" --if-match "$etag" || true
              fi
            fi
            fi
          fi

          # ECS log group import by exact name
          if aws logs describe-log-groups \
            --log-group-name-prefix "$ECS_LOG_GROUP" \
            --query "length(logGroups[?logGroupName=='${ECS_LOG_GROUP}'])" \
            --output text | grep -q '^1$'; then
            echo "Found existing ECS log group: ${ECS_LOG_GROUP}"
            if terraform -chdir=environments/dev state show 'module.orchestrator.module.ecs_transcoder[0].aws_cloudwatch_log_group.this' >/dev/null 2>&1; then
              echo "ECS log group resource already in terraform state. Skip import."
            else
            set +e
            terraform -chdir=environments/dev import \
              $TF_VAR_ARGS \
              'module.orchestrator.module.ecs_transcoder[0].aws_cloudwatch_log_group.this' \
              "$ECS_LOG_GROUP"
            import_lg_ec=$?
            set -e
            if [ "$import_lg_ec" -ne 0 ]; then
              echo "Log group import failed. Trying delete as fallback..."
              aws logs delete-log-group --log-group-name "$ECS_LOG_GROUP" || true
            fi
            fi
          fi

      - name: Terraform Validate (dev)
        run: terraform -chdir=environments/dev validate

      - name: Terraform Plan (dev)
        shell: bash
        run: |
          set +e
          terraform -chdir=environments/dev plan \
            -var="aws_region=${{ github.event.inputs.aws_region || 'ap-northeast-2' }}" \
            -var="project=${{ github.event.inputs.project || 'oplust' }}" \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var="base_domain=${{ github.event.inputs.base_domain || 'openthetaste.cloud' }}" \
            -out tfplan
          ec=$?
          set -e
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 2 ]; then
            echo "terraform plan failed with exit code $ec"
            exit "$ec"
          fi

      - name: Terraform Apply (dev)
        run: terraform -chdir=environments/dev apply -auto-approve tfplan
