name: Deploy Dev (environments/dev)

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: false
        default: ap-northeast-2
      project:
        description: Terraform variable project
        required: false
        default: oplust
      environment:
        description: Terraform variable environment
        required: false
        default: dev
      base_domain:
        description: Terraform variable base_domain
        required: true
        default: openthetaste.cloud
      state_key:
        description: Terraform state key for dev
        required: false
        default: oplust/dev/terraform.tfstate
      state_bucket:
        description: Terraform state bucket for dev (optional; auto-derived if empty)
        required: false
        default: ""

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region || 'ap-northeast-2' }}

      - name: Generate backend.hcl for dev
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ github.event.inputs.aws_region || 'ap-northeast-2' }}"
          INPUT_BUCKET="${{ github.event.inputs.state_bucket }}"

          if [ -n "$INPUT_BUCKET" ]; then
            BUCKET="$INPUT_BUCKET"
          else
            BUCKET="oplust-tfstate-${ACCOUNT_ID}-${REGION}"
          fi

          cat > environments/dev/backend.hcl <<EOF
          bucket       = "${BUCKET}"
          key          = "${{ github.event.inputs.state_key || 'oplust/dev/terraform.tfstate' }}"
          region       = "${REGION}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: Terraform Init (dev)
        run: terraform -chdir=environments/dev init -backend-config=backend.hcl -reconfigure

      - name: Terraform Validate (dev)
        run: terraform -chdir=environments/dev validate

      - name: Terraform Plan (dev)
        shell: bash
        run: |
          set +e
          terraform -chdir=environments/dev plan \
            -var="aws_region=${{ github.event.inputs.aws_region || 'ap-northeast-2' }}" \
            -var="project=${{ github.event.inputs.project || 'oplust' }}" \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -var="base_domain=${{ github.event.inputs.base_domain || 'openthetaste.cloud' }}" \
            -out tfplan
          ec=$?
          set -e
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 2 ]; then
            echo "terraform plan failed with exit code $ec"
            exit "$ec"
          fi

      - name: Terraform Apply (dev)
        run: terraform -chdir=environments/dev apply -auto-approve tfplan
